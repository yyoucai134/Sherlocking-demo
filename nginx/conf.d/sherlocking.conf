# ============================================================
# Sherlocking Web — Nginx HTTPS 反向代理配置
# ------------------------------------------------------------
# 访问链路：
#   http:// 任意域名        -> 301 跳转到 https
#   https://www.主域        -> 301 跳转到 https://主域（统一入口）
#   https://主域            -> 转发给 sherlocking-web 容器:8080
#
# 证书文件（腾讯云下载，服务器类型选 Nginx）放到：
#   nginx/certs/yyyoucai134.top_bundle.crt
#   nginx/certs/yyyoucai134.top.key
#   nginx/certs/www.yyyoucai134.top_bundle.crt
#   nginx/certs/www.yyyoucai134.top.key
# 文件名不同就改成上面这四个名字；.key 是私钥，切勿外传。
#
# 如果只申请了主域一张证书：把本文件中"② www 跳转"整个 server 块
# 删掉即可，不影响主域使用。
# ============================================================

# WebSocket 专用映射：
# 浏览器带 Upgrade 头（/ws 长连接）-> 值为 upgrade，连接保持不断；
# 普通 HTTP 请求 -> 值为 close，按普通请求处理。
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ------------------------------------------------------------
# ① HTTP 80：全部永久跳转到 HTTPS
# ------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name yyyoucai134.top www.yyyoucai134.top;

    # $host 保留用户输入的域名（主域或 www），跳到各自的 HTTPS
    return 301 https://$host$request_uri;
}

# ------------------------------------------------------------
# ② HTTPS 443：www 统一跳转到主域（需要 www 的证书）
# ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.yyyoucai134.top;

    ssl_certificate     /etc/nginx/certs/www.yyyoucai134.top_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/www.yyyoucai134.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL_WWW:10m;
    ssl_session_timeout 10m;

    return 301 https://yyyoucai134.top$request_uri;
}

# ------------------------------------------------------------
# ③ HTTPS 443：主域，真正提供服务
# ------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name yyyoucai134.top;

    # ---- SSL 证书 ----
    ssl_certificate     /etc/nginx/certs/yyyoucai134.top_bundle.crt;
    ssl_certificate_key /etc/nginx/certs/yyyoucai134.top.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL_MAIN:10m;
    ssl_session_timeout 10m;

    # ---- 基础限制与安全响应头 ----
    client_max_body_size 10m;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- 页面 + 静态资源 + WebSocket，统一转发 ----
    location / {
        proxy_pass http://sherlocking-web:8080;
        proxy_http_version 1.1;

        # 透传客户端真实信息（后端拿真实 IP、正确识别协议靠这几个头）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 【关键】WebSocket 长连接：AI 流式对话走 /ws，
        # 少了这两行页面能打开，但发消息后永远收不到流式回复。
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 【关键】关闭响应缓冲：让 AI 的思考/回复实时吐给浏览器，
        # 而不是 Nginx 攒一大块才发。
        proxy_buffering off;

        # 深度研究任务可能持续几分钟到几十分钟，超时放宽到 1 小时，
        # 防止 Nginx 在任务进行中主动掐断连接。
        proxy_connect_timeout 60s;
        proxy_send_timeout    3600s;
        proxy_read_timeout    3600s;
    }
}
