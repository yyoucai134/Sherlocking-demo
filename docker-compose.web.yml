# Sherlocking Web 公网部署配置（常驻网页服务模式）
#
# 部署到服务器后使用（不要用默认的 docker-compose.yml，那个是命令行交互模式）：
#   首次构建并启动:  docker compose -f docker-compose.web.yml up -d --build
#   查看实时日志:    docker compose -f docker-compose.web.yml logs -f
#   重启:           docker compose -f docker-compose.web.yml restart
#   停止:           docker compose -f docker-compose.web.yml down
#   更新代码后重建:  docker compose -f docker-compose.web.yml up -d --build
#
# 访问地址: https://你的域名（由 nginx 容器占用 80/443 统一入口）
# 前提: Ubuntu Docker Engine 已运行；项目根目录的 .env 中已填写
# DEEPSEEK_API_KEY、SHERLOCKING_WEB_AUTH_TOKEN，并已按需拉取沙箱镜像。
# HTTPS: 证书放入 nginx/certs/ 后再启动（文件名见 nginx/conf.d/sherlocking.conf 头部说明）。
#        阿里云安全组需同时放行 TCP 80 和 443。

services:
  sherlocking-web:
    build: .
    image: sherlocking:web
    container_name: sherlocking-web
    # 开机自启 + 程序崩溃自动重启
    restart: unless-stopped
    # 从项目根目录 .env 读取密钥等配置（文件不存在会启动失败，属正常保护）
    env_file:
      - path: .env
        required: true
    environment:
      # 容器内开启长期记忆（占用很小）
      - SHERLOCKING_MEMORY_USE=default
      # 2核2G 小机器：显式关闭网页用不到的重量级功能，只保留"网页对话 + 记忆"
      # multiagent 会尝试拉起外部编码助手(pi/codex/claude)，纯网页聊天不需要
      - SHERLOCKING_MULTIAGENT_ENABLED=false
      # 生产默认使用 Docker 沙箱；Local Sandbox 仅建议本地开发显式开启。
      - SHERLOCKING_SANDBOX_USE=${SHERLOCKING_SANDBOX_USE:-sherlocking.backend.agents.sandbox.docker.docker_sandbox_provider:DockerSandboxProvider}
      # Ubuntu 2C2G：只保留一个可复用沙箱，空闲 5 分钟销毁。
      - SHERLOCKING_SANDBOX_REPLICAS=${SHERLOCKING_SANDBOX_REPLICAS:-1}
      - SHERLOCKING_SANDBOX_IDLE_TIMEOUT=${SHERLOCKING_SANDBOX_IDLE_TIMEOUT:-300}
      # 沙箱端口发布到宿主机，Web 容器经 host-gateway 回连。
      - SHERLOCKING_SANDBOX_HOST=${SHERLOCKING_SANDBOX_HOST:-host.docker.internal}
      - SHERLOCKING_SANDBOX_BIND_HOST=${SHERLOCKING_SANDBOX_BIND_HOST:-0.0.0.0}
      - SHERLOCKING_SANDBOX_EXECUTOR=${SHERLOCKING_SANDBOX_EXECUTOR:-local}
      # 日志级别：INFO=默认（对话轨迹/工具调用）；排查疑难时改 DEBUG（含思考流/预算/框架细节）
      # 改完执行 docker compose -f docker-compose.web.yml up -d 即生效，无需重新构建
      - SHERLOCKING_LOG_LEVEL=INFO
    # 覆盖镜像默认的命令行入口，改为启动网页服务
    command: ["web", "--host", "0.0.0.0", "--port", "8080"]
    # 不再直接映射宿主机 80 端口：由同 compose 内的 nginx 容器统一对外，
    # sherlocking-web 只在 Docker 内部网络暴露 8080，外部无法直连。
    expose:
      - "8080"
    extra_hosts:
      # Ubuntu 20.10+ / Docker Engine：让容器访问宿主机映射端口。
      - "host.docker.internal:host-gateway"
    volumes:
      # 数据持久化：对话记忆、日志、产物重启不丢
      - ./.sherlocking:/app/.sherlocking
      - ./skills:/app/skills
      # Docker Sandbox Provider 需要创建/销毁独立沙箱容器。
      - /var/run/docker.sock:/var/run/docker.sock

  # ------------------------------------------------------------
  # Nginx：HTTPS 统一入口（80 跳转 443，证书卸载，WebSocket 透传）
  # 配置文件：nginx/conf.d/sherlocking.conf
  # 证书目录：nginx/certs/（需手动放入 .crt 和 .key，见配置文件头注释）
  # ------------------------------------------------------------
  nginx:
    image: nginx:stable-alpine
    container_name: sherlocking-nginx
    restart: unless-stopped
    depends_on:
      - sherlocking-web
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 只读挂载 Nginx 配置与证书，更新证书只需替换文件后重启本容器
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
